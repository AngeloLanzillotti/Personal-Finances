<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Finanze</title>
    <!-- Librerie Esterne -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- File Script Separato -->
    <script src="/static/dashboard.js" defer></script>
</head>

<body class="bg-slate-900 text-white font-sans p-4 pb-12">
    <div class="max-w-md mx-auto space-y-4">
        <!-- Header con Bottone Refresh -->
        <div class="flex justify-between items-center border-b border-slate-700 pb-3">
            <div>
                <h1 class="text-xl font-bold">📊 Bilancio Personale</h1>
                <span id="currentMonth" class="text-xs text-indigo-400 font-semibold">Caricamento...</span>
            </div>
            <button onclick="loadData(true)" id="refreshBtn" class="bg-slate-800 hover:bg-slate-700 active:scale-95 transition border border-slate-600 px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1">
                🔄 Aggiorna
            </button>
        </div>

        <!-- KPI Cards -->
        <div class="grid grid-cols-3 gap-2">
            <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 text-center">
                <p class="text-xs text-slate-400">Entrate</p>
                <p id="totalIncome" class="text-sm font-bold text-emerald-400">--</p>
            </div>
            <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 text-center">
                <p class="text-xs text-slate-400">Uscite</p>
                <p id="totalExpense" class="text-sm font-bold text-rose-400">--</p>
            </div>
            <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 text-center">
                <p class="text-xs text-slate-400">Saldo</p>
                <p id="netBalance" class="text-sm font-bold text-indigo-400">--</p>
            </div>
        </div>

        <!-- Grafico Categorie -->
        <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 space-y-2">
            <h2 class="text-sm font-semibold text-slate-300">Spese per Categoria</h2>
            <div class="relative h-64 w-full flex items-center justify-center">
                <canvas id="expenseChart"></canvas>
                <p id="noDataText" class="hidden text-xs text-slate-500">Nessuna spesa questo mese</p>
            </div>
        </div>

        <!-- Debiti / Crediti Amici Card -->
        <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 space-y-3">
            <h2 class="text-sm font-semibold text-slate-300">👥 Saldi Amici</h2>
            <div id="friendsBalances" class="space-y-2 text-xs">
                <p class="text-slate-500">Caricamento saldi...</p>
            </div>
        </div>
    </div>
</body>

</html>
